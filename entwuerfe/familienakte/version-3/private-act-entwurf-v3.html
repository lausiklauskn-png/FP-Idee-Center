<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3154">
<title>Private Act · Entwurf Version 3</title>
<style>
:root{--navy:#0b3154;--navy2:#164f7d;--ink:#182f43;--muted:#5d7080;--teal:#087f7a;--tealsoft:#e8f6f3;--blue:#edf4fa;--line:#dce5ec;--paper:#fff;--bg:#f3f6f9;--amber:#956117;--ambersoft:#fdf3e0;--red:#a43030;--redsoft:#fbecec;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-size:15px;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
/* Kopf */
.kopf{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.marke{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;letter-spacing:.5px;flex:none}
.name{display:grid;line-height:1.15;margin-right:auto;min-width:0}
.name strong{font-size:16px;letter-spacing:.3px;color:var(--navy)}
.name small{font-size:11.5px;color:var(--muted)}
.rund{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--paper);color:var(--navy);flex:none;font-weight:700}
.rund:active,.knopf:active{transform:scale(.97)}
/* Navigation: Handy unten, breit links */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;color:var(--muted);position:relative}
.nav button[aria-current=page]{color:var(--navy);background:var(--blue);font-weight:600}
.nav .ablegen{background:var(--teal);color:#fff;width:58px;height:58px;border-radius:50%;justify-self:center;align-content:center;margin-top:-22px;box-shadow:0 6px 18px #087f7a55;font-size:10.5px;font-weight:600;gap:0}
.nav .ablegen .icon{width:22px;height:22px}
.zahl{position:absolute;top:2px;right:calc(50% - 22px);background:var(--amber);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
main{padding:16px;max-width:1060px;width:100%;margin:0 auto;min-width:0}
@media(min-width:900px){
 .app{grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto 1fr;padding-bottom:0}
 .kopf{grid-column:1/-1}
 .nav{position:sticky;top:59px;align-self:start;grid-column:1;grid-row:2;border:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:16px 12px;height:calc(100vh - 59px);background:var(--paper)}
 .nav button{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:14px}
 .nav .ablegen{order:-1;width:auto;height:auto;border-radius:12px;margin:0 0 12px;padding:13px 12px;font-size:14px;justify-self:stretch;justify-content:center}
 .zahl{position:static;margin-left:auto}
 main{grid-column:2;padding:24px 28px}
}
/* Bausteine */
.titel{font-size:22px;color:var(--navy);line-height:1.2}
.unter{color:var(--muted);margin-top:2px}
.abschnitt{margin-top:22px}
.abschnitt>h2{font-size:14px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.abschnitt>h2 span{font-weight:400;color:var(--muted);font-size:12.5px}
.suche{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin-top:14px;color:var(--muted)}
.suche:focus-within{border-color:var(--navy2);box-shadow:0 0 0 3px #164f7d22}
.suche input{flex:1;border:0;outline:0;background:none;min-width:0;padding:8px 0;color:var(--ink)}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border-radius:11px;padding:10px 14px;font-weight:600;font-size:14px}
.knopf.hell{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.knopf.gruen{background:var(--teal)}
.knopf.voll{width:100%}
.knopf[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--ink)}
.kacheln{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.kacheln{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.kacheln{grid-template-columns:repeat(6,1fr)}}
.kachel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.kachel .sym{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kachel strong{display:block;font-size:13.5px;line-height:1.2}
.kachel small{color:var(--muted);font-size:12px}
.liste{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.zeile{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%}
.zeile:first-child{border-top:0}
.zeile .mitte{flex:1;min-width:0}
.zeile strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none;background:var(--blue);color:var(--navy2)}
.art.PDF{background:#fdeeee;color:#a43030}.art.JPG{background:var(--tealsoft);color:var(--teal)}.art.BELEG{background:var(--ambersoft);color:var(--amber)}
.marke2{font-size:11px;border-radius:99px;padding:2px 8px;font-weight:600;white-space:nowrap}
.m-arbeit{background:var(--ambersoft);color:var(--amber)}.m-ok{background:var(--tealsoft);color:var(--teal)}.m-grau{background:var(--blue);color:var(--muted)}.m-rot{background:var(--redsoft);color:var(--red)}
.haken{width:20px;height:20px;accent-color:var(--navy);flex:none}
.leiste{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:12px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #0b315433}
@media(min-width:900px){.leiste{bottom:16px}}
.leiste .knopf{background:#fff;color:var(--navy);margin-left:auto}
.leer{padding:22px;text-align:center;color:var(--muted)}
.hinweis{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
.karte{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.zweier{display:grid;gap:8px}
@media(min-width:640px){.zweier{grid-template-columns:1fr 1fr}}
/* Fenster */
.schleier{position:fixed;inset:0;background:#0b315466;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.fenster{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.schleier{align-items:center}.fenster{border-radius:20px}}
.fenster.ast{max-width:760px;border-top:5px solid var(--farbe,var(--teal))}
.fkopf{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.fkopf h2{font-size:18px;color:var(--navy);flex:1;line-height:1.25}
.fkopf small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.blatt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;min-height:120px}
.blatt b{display:block;font-size:15px;margin:6px 0;color:var(--navy)}
.blatt .mark{background:#fff3a6}
.angaben{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:12px 0}
.angaben dt{color:var(--muted)}.angaben dd{margin:0}
.zettel{border:1.5px dashed var(--navy2);border-radius:12px;padding:12px 14px;background:#fbfdff;margin:10px 0}
.zettel h3{font-size:12px;letter-spacing:1px;color:var(--navy2);margin-bottom:6px}
.reihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.schritte{display:flex;gap:6px;margin:10px 0;font-size:12px}
.schritte span{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--blue);color:var(--muted)}
.schritte span.an{background:var(--navy);color:#fff;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.toast:empty{display:none}
.geld{font-size:34px;font-weight:700;color:var(--navy);line-height:1.1}
.plus{color:var(--teal);font-weight:600}.minus{color:var(--red);font-weight:600}
.feld{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper);min-width:0}
/* Baum */
.baumbild{position:relative;border-radius:18px;overflow:hidden;background:#0a1f44;max-width:900px;margin:0 auto}
.baumbild img{display:block;width:100%;height:auto}
.schild{position:absolute;transform:translate(-50%,-50%);background:#0b1b3dd9;color:#fff;border:2px solid var(--farbe,#9be7c4);border-radius:12px;padding:4px 9px;text-align:center;line-height:1.15;box-shadow:0 4px 14px #0008;white-space:nowrap}
.schild b{display:block;font-size:11px}.schild small{font-size:9.5px;opacity:.85}
.schild.geplant{border-style:dashed;opacity:.9}
.schild.akte{border-color:#ffd98a;background:#3a2408e6}
.schild:hover,.schild:focus-visible{background:#0b1b3d;outline:2px solid #fff}
@media(min-width:640px){.schild{padding:7px 14px}.schild b{font-size:14px}.schild small{font-size:11.5px}}
.baumfilm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.baumtext{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#0b1b3dd9;color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;white-space:nowrap;animation:weg .4s 5.5s forwards}
@keyframes weg{to{opacity:0}}
</style>
</head>

const bons = [['Bäckerei',-4.80],['Supermarkt',-37.25],['Tankstelle',-52.10],['Drogerie',-12.95],['Baumarkt',-23.40]];
const geld = { start:600, posten:[{t:'Monatsgeld November',b:600},{t:'Wochenmarkt',b:-18.50}], bonNr:0, docId:null };
const s = { ansicht:'start', bereich:null, frage:'', wahl:new Set(), reisen:[] };

/* ---------- Helfer ---------- */
let toastZeit;
function toast(t){ $('toast').textContent = t; clearTimeout(toastZeit); toastZeit = setTimeout(() => $('toast').textContent = '', 5200); }
const ort = d => `${bereich(d.bereich).name} / ${d.vorgang}`;
const SYN = {unterlagen:'',alles:'',zur:'',zum:'',der:'',die:'',das:'',meine:'',mein:'',ich:'',brauche:'',nebenkostenabrechnung:'nebenkosten',gesundheitsunterlagen:'gesundheit',arzt:'gesundheit',wohnung:'wohnen',miete:'miet',auto:'auto',steuern:'steuer'};
function suche(frage){
  const w = frage.toLowerCase().split(/[^a-zäöüß0-9]+/).map(x => x in SYN ? SYN[x] : x).filter(x => x.length > 2);
  if (!w.length) return [];
  return docs.filter(d => { const heu = (d.titel+' '+ort(d)+' '+d.text+' '+d.art).toLowerCase(); return w.every(x => heu.includes(x)); });
}
function docZeile(d, {haken=false}={}){
  const m = d.bei ? `<span class="marke2 m-arbeit">in Arbeit: ${esc(werkzeug(d.bei).name)}</span>` : d.fassung > 1 ? `<span class="marke2 m-ok">Fassung ${d.fassung}</span>` : '';
  return `<div class="zeile">${haken?`<input type="checkbox" class="haken" data-wahl="${d.id}" ${s.wahl.has(d.id)?'checked':''} aria-label="${esc(d.titel)} auswählen">`:''}
   <button class="zeile" style="padding:0;border:0" data-a="doc" data-id="${d.id}"><span class="art ${d.art}">${d.art}</span><span class="mitte"><strong>${esc(d.titel)}</strong><small>${esc(ort(d))} · ${d.datum}</small></span>${m}${ic('weiter')}</button></div>`;
}

/* ---------- Ansichten ---------- */
const NAV = [['start','Start'],['akten','Akten'],['ablegen','Ablegen'],['eingang','Eingang'],['werkzeuge',V3?'Werkzeuge':'Module']];
function navZeigen(){
  $('nav').innerHTML = NAV.map(([id,t]) => id === 'ablegen'
    ? `<button class="ablegen" data-a="ablegen">${ic('plus')}<span>Ablegen</span></button>`
    : `<button data-a="geh" data-zu="${id}" ${s.ansicht===id?'aria-current="page"':''}>${ic(id)}<span>${t}</span>${id==='eingang'&&eingang.neu.length?`<span class="zahl">${eingang.neu.length}</span>`:''}</button>`).join('');
}
function sucheFeld(){
  return `<form class="suche" data-form="suche">${ic('lupe')}<input name="q" value="${esc(s.frage)}" placeholder="Welche Unterlage brauchst du?" aria-label="Suchen" autocomplete="off"><button class="knopf" type="submit">Finden</button></form>
  <div class="chips">Zum Beispiel: ${['Alles zur Nebenkostenabrechnung','Garantie Waschmaschine','Meine Gesundheitsunterlagen'].map(c => `<button class="chip" data-a="frage" data-q="${c}">${c}</button>`).join('')}</div>`;
}
function treffer(){
  const t = suche(s.frage);
  if (!t.length) return `<div class="abschnitt"><div class="liste"><p class="leer">Nichts gefunden zu „${esc(s.frage)}“. Versuch ein anderes Wort.</p></div></div>`;
  return `<div class="abschnitt"><h2>${t.length} ${t.length===1?'Unterlage':'Unterlagen'} <span>aus ${new Set(t.map(d=>d.bereich)).size} ${new Set(t.map(d=>d.bereich)).size===1?'Bereich':'Bereichen'} · anhaken zum Sammeln</span></h2>
   <div class="liste">${t.map(d => docZeile(d,{haken:true})).join('')}</div>${leiste()}</div>`;
}
function leiste(){
  if (!s.wahl.size) return '';
  return `<div class="leiste"><span>${s.wahl.size} gesammelt</span><button class="knopf" data-a="mappe">${V3?'Mappe öffnen':'Als Mappe herausgeben'} ${ic('pfeil')}</button></div>`;
}
function vStart(){
  const zuletzt = [...docs].sort((a,b) => b.id - a.id).slice(0,4);
  return `<h1 class="titel">Was möchtest du finden?</h1><p class="unter">Hineinlegen, finden, herausgeben. Mehr macht die Akte nicht.</p>
  ${sucheFeld()}
  ${s.frage ? treffer() : `
  <div class="abschnitt"><h2>Fällig <span>${fristen.length} Fristen</span></h2><div class="liste">${fristen.map(f => `<button class="zeile" data-a="doc" data-id="${f.doc}"><span class="mitte"><strong>${esc(f.titel)}</strong><small>bis ${f.bis}</small></span><span class="marke2 ${f.tage<14?'m-rot':'m-grau'}">noch ${f.tage} Tage</span>${ic('weiter')}</button>`).join('')}</div></div>
  <div class="abschnitt"><h2>Bereiche</h2><div class="kacheln">${BEREICHE.map(b => { const n = docs.filter(d => d.bereich===b.id).length; return `<button class="kachel" data-a="bereich" data-id="${b.id}"><span class="sym" style="background:${b.f};color:${b.c}">${ic(b.icon)}</span><span><strong>${b.name}</strong><small>${n} ${n===1?'Unterlage':'Unterlagen'}</small></span></button>`; }).join('')}</div></div>
  <div class="abschnitt"><h2>Zuletzt abgelegt</h2><div class="liste">${zuletzt.map(d => docZeile(d)).join('')}</div></div>`}
  <p class="hinweis">Entwurf Version ${F} · Alle Unterlagen sind erfunden. Nichts wird gespeichert.</p>`;
}
function vAkten(){
  if (!s.bereich) return `<h1 class="titel">Akten</h1><p class="unter">Dieselben sechs Bereiche wie auf der Startseite.</p>
   <div class="abschnitt"><div class="liste">${BEREICHE.map(b => { const d = docs.filter(x => x.bereich===b.id); return `<button class="zeile" data-a="bereich" data-id="${b.id}"><span class="art" style="background:${b.f};color:${b.c}">${ic(b.icon)}</span><span class="mitte"><strong>${b.name}</strong><small>${[...new Set(d.map(x=>x.vorgang))].join(' · ')||'noch leer'}</small></span><span class="marke2 m-grau">${d.length}</span>${ic('weiter')}</button>`; }).join('')}</div></div>`;
  const b = bereich(s.bereich), d = docs.filter(x => x.bereich===b.id), vorg = [...new Set(d.map(x => x.vorgang))];
  return `<button class="chip" data-a="bereich" data-id="">‹ Alle Bereiche</button><h1 class="titel" style="margin-top:10px">${b.name}</h1><p class="unter">${d.length} Unterlagen in ${vorg.length} ${vorg.length===1?'Vorgang':'Vorgängen'}</p>
   ${vorg.map(v => `<div class="abschnitt"><h2>${esc(v)}</h2><div class="liste">${d.filter(x => x.vorgang===v).map(x => docZeile(x)).join('')}</div></div>`).join('')}`;
}
function vEingang(){
  const z = eingang.zurueck, n = eingang.neu;
  return `<h1 class="titel">Eingang</h1><p class="unter">Geprüft wird nur, was wirklich neu ist.</p>
  <div class="abschnitt"><h2>Neu <span>Vorschlag bestätigen oder ändern</span></h2><div class="liste">${n.length ? n.map(e => `<div class="zeile" style="flex-wrap:wrap"><span class="art ${e.art}">${e.art}</span><span class="mitte"><strong>${esc(e.titel)}</strong><small>aus: ${esc(e.quelle)}</small></span>
    <span style="display:flex;gap:6px;flex:1 1 100%;align-items:center"><select class="feld" data-vorschlag="${e.id}" aria-label="Bereich" style="flex:1">${BEREICHE.map(b => `<option value="${b.id}" ${b.id===e.vorschlag?'selected':''}>${b.name}${b.id===e.vorschlag?' (Vorschlag)':''}</option>`).join('')}</select><button class="knopf gruen" data-a="bestaetigen" data-id="${e.id}">Stimmt</button></span></div>`).join('') : '<p class="leer">Nichts zu prüfen.</p>'}</div></div>
  <div class="abschnitt"><h2>${V3?'Aus den Werkzeugen':'Zurück aus einem Modul'} <span>schon abgelegt, nur zur Kenntnis</span></h2><div class="liste">${z.length ? z.map(e => `<button class="zeile" data-a="doc" data-id="${e.doc}"><span class="art m-ok" style="background:var(--tealsoft);color:var(--teal)">✓</span><span class="mitte"><strong>${esc(e.titel)}</strong><small>${esc(e.text)}</small></span>${ic('weiter')}</button>`).join('') : `<p class="leer">Noch nichts zurückgekommen. Öffne eine Unterlage und tippe auf „${V3?'Im Werkzeug öffnen':'Bearbeiten'}“.</p>`}</div></div>`;
}
function vWerkzeuge(){
  if (V3) return vBaum();
  return `<h1 class="titel">Module</h1><p class="unter">Die Akte bewahrt. Die Arbeit an einer Datei passiert in einer eigenen App.</p>
  <div class="abschnitt"><div class="liste">${WERKZEUGE.map(w => `<div class="zeile"><span class="art" style="background:${w.farbe}22;color:${w.farbe}">${ic(w.icon)}</span><span class="mitte"><strong>${w.name}</strong><small>${w.tut}</small></span>${w.da?'<span class="marke2 m-ok">installiert</span>':'<button class="marke2 m-rot" data-a="fehlt">fehlt – hier holen</button>'}</div>`).join('')}</div></div>
  <div class="abschnitt"><h2>So läuft eine Übergabe</h2><div class="karte"><div class="schritte"><span class="an">1 Herausgeben</span><span class="an">2 Arbeiten</span><span class="an">3 Zurücklegen</span></div>
   <p style="font-size:13.500px">Die Akte gibt eine Kopie mit einem <b>Laufzettel</b> hinaus. Auf dem Zettel steht, wohin das Ergebnis gehört. Das Original bleibt unberührt. Kommt das Ergebnis zurück, liegt es ohne Rückfrage als neue Fassung am alten Platz.</p>
   <div class="reihe"><button class="knopf" data-a="doc" data-id="1">An einem Beispiel durchspielen ${ic('pfeil')}</button></div></div></div>
  <p class="hinweis">Die Module sind hier nur dargestellt. Es wird keine echte App geöffnet.</p>`;
}

const ORT = { sort:[15,34], pdf:[89,11], geld:[12,80], mail:[82,88], text:[68,34] };
function blaetter(id){ return id==='geld' ? geld.posten.length : id==='sort' ? organizer.length : docs.filter(d => d.bei===id).length; }
function schild(w){ const [x,y] = ORT[w.id], n = blaetter(w.id);
  return `<button class="schild ${w.da?'':'geplant'}" style="left:${x}%;top:${y}%;--farbe:${w.farbe}" data-a="werkzeug" data-id="${w.id}"><b>${w.name}</b><small>${w.da ? (n ? n+(n===1?' Datei':' Dateien') : 'bereit') : 'geplant'}</small></button>`; }
function vBaum(){
  const film = s.reisen.length && BILD.film ? `<video class="baumfilm" src="${BILD.film}" autoplay muted playsinline onended="this.remove()" onerror="this.remove()"></video><span class="baumtext">Die Helfer tragen die Dateien in die Akte.</span>` : '';
  s.reisen = [];
  return `<h1 class="titel">Der Baum</h1><p class="unter">Eine App. In der Mitte die Akte, an den Ästen die Städte – jede Stadt ist ein Programm.</p>
  <div class="abschnitt"><div class="baumbild"><img src="${BILD.baum}" alt="Ein großer Baum am Abend. In der Mitte eine leuchtende Halle, an den Ästen kleine Städte. An einem neuen Ast entsteht gerade eine weitere Stadt mit Kränen, bunte Helfer schauen zu.">
   <button class="schild akte" style="left:37%;top:73%" data-a="geh" data-zu="start"><b>${NAME}</b><small>die Akte · ${docs.length} Unterlagen</small></button>
   ${WERKZEUGE.map(schild).join('')}${film}</div></div>
  <div class="abschnitt zweier">
   <div class="karte"><b>Die Halle in der Mitte = die Akte.</b> Hier liegt alles, hier wird gesucht. Jede Datei bleibt, wo sie einsortiert wurde.</div>
   <div class="karte"><b>Städte an den Ästen = die Programme.</b> Jede Stadt ist ein Werkzeug für sich: nur das Nötige, eigener Bildschirm. Du bringst die Dateien hinein.</div>
   <div class="karte"><b>Bunte Kugeln = die Helfer.</b> Sie arbeiten in der Stadt: lesen, zuordnen, rechnen. Sie raten, du berichtigst, sie lernen. Du kannst auch alles selbst zuordnen.</div>
   <div class="karte"><b>Lichtwege = der Weg der Dateien.</b> PDF, Foto, Bon, Brief. Fertig zugeordnet gehen sie mit „Zur Akte“ über den Ast in die Halle. Ohne Umweg, weil es eine App ist.</div>
   <div class="karte" style="grid-column:1/-1"><b>Der neue Ast mit den Kränen = ein neues Programm.</b> Eine neue Stadt ändert nichts an der Halle und nichts an den anderen Städten. Sie wird erst geprüft und dann angeschlossen.</div>
  </div>
  <p class="hinweis">Tippe ein Schild an. Gestrichelt = geplant. Das Bild stammt aus der Discovery-Seite des Datei-Organizers.</p>`;
}

/* ---------- Fenster ---------- */
function fenster(html, klasse='', farbe=''){ $('fensterort').innerHTML = `<div class="schleier" data-a="zu-aussen"><div class="fenster ${klasse}" ${farbe?`style="--farbe:${farbe}"`:''} role="dialog" aria-modal="true">${html}</div></div>`; }
function zu(){ $('fensterort').innerHTML = ''; }
const fk = (t, u='') => `<div class="fkopf"><h2>${t}${u?`<small>${u}</small>`:''}</h2><button class="rund" data-a="zu" aria-label="Schließen">${ic('zu')}</button></div>`;
function fDoc(id){
  const d = docs.find(x => x.id == id); if (!d) return;
  const w = werkzeugFuer(d);
  let knopf;
  if (d.bei) knopf = `<button class="knopf gruen voll" data-a="werkzeug" data-id="${d.bei}" data-docs="${d.id}">Weiter in ${esc(werkzeug(d.bei).name)} ${ic('pfeil')}</button>`;
  else if (!w) knopf = '';
  else if (!w.da) knopf = `<button class="knopf hell voll" disabled>${esc(w.name)} ${V3?'ist geplant':'fehlt auf diesem Gerät'}</button>`;
  else knopf = `<button class="knopf voll" data-a="${V3?'werkzeug':'zettel'}" data-id="${w.id}" data-docs="${d.id}">${ic(w.icon)} In ${esc(w.name)} ${w.verb}</button>`;
  fenster(`${fk(esc(d.titel), esc(ort(d)))}
   <div class="blatt"><small>${d.art} · Vorschau</small><b>${esc(d.titel)}</b>${esc(d.text)}${d.fassung>1?'<p style="margin-top:8px"><span class="mark">Markierung aus der Bearbeitung</span></p>':''}</div>
   <dl class="angaben"><dt>Abgelegt</dt><dd>${d.datum}</dd><dt>Herkunft</dt><dd>${esc(d.herkunft)}</dd><dt>Fassung</dt><dd>${d.fassung}${d.fassung>1?' (ältere bleiben erhalten)':''}</dd>${d.bei?`<dt>Zustand</dt><dd><span class="marke2 m-arbeit">Kopie in Arbeit: ${esc(werkzeug(d.bei).name)}</span></dd>`:''}</dl>
   ${knopf}<div class="reihe"><button class="knopf hell" data-a="kopie">Kopie herausholen</button><button class="knopf hell" data-a="teilen">Teilen</button></div>`);
}
function fZettel(wid, ids){
  const w = werkzeug(wid), ds = ids.map(i => docs.find(d => d.id == i));
  fenster(`${fk('Herausgeben an '+esc(w.name),'Das Original bleibt in der Akte.')}
   <div class="schritte"><span class="an">1 Herausgeben</span><span>2 Arbeiten</span><span>3 Zurücklegen</span></div>
   <div class="zettel"><h3>LAUFZETTEL</h3><dl class="angaben" style="margin:0"><dt>${ds.length===1?'Unterlage':'Mappe'}</dt><dd>${ds.map(d => esc(d.titel)).join('<br>')}</dd><dt>Gehört zu</dt><dd>${[...new Set(ds.map(ort))].map(esc).join('<br>')}</dd><dt>Fassung</dt><dd>${ds.map(d => d.fassung).join(', ')} → kommt als nächste zurück</dd><dt>Geht an</dt><dd>${esc(w.name)}</dd></dl></div>
   <button class="knopf voll" data-a="werkzeug" data-id="${w.id}" data-docs="${ids.join(',')}">Herausgeben ${ic('pfeil')}</button>`);
}
function fMappe(){
  const ids = [...s.wahl];
  if (V3) return fWerkzeug('pdf', ids);
  const pass = WERKZEUGE.filter(w => w.arten.length);
  fenster(`${fk('Sammelmappe herausgeben', ids.length+' Unterlagen gehen gemeinsam hinaus und kommen gemeinsam zurück.')}
   <div class="liste">${pass.map(w => `<button class="zeile" data-a="${w.da?'zettel':'fehlt'}" data-id="${w.id}" data-docs="${ids.join(',')}"><span class="art" style="background:${w.farbe}22;color:${w.farbe}">${ic(w.icon)}</span><span class="mitte"><strong>${w.name}</strong><small>${w.tut}</small></span>${w.da?ic('weiter'):'<span class="marke2 m-rot">fehlt</span>'}</button>`).join('')}</div>`);
}
function fWerkzeug(wid, ids=[]){
  const w = werkzeug(wid);
  if (!w.da) { toast(`${w.name} ist ${V3?'geplant':'auf diesem Gerät nicht installiert'}.`); return; }
  ids = ids.map(Number).filter(Boolean);
  ids.forEach(i => { const d = docs.find(x => x.id === i); if (d) d.bei = w.id; });
  const kopf = fk(esc(w.name), V3 ? `Werkzeug in ${NAME} · eigener Ast` : 'Eigene App · erfundene Beispielansicht');
  let inhalt;
  if (wid === 'geld' && V3) inhalt = portemonnaie();
  else if (wid === 'sort') inhalt = `<p class="unter">Du wirfst die Dateien hinein. Die Zuordnung passiert hier im Haus: ${V3?'ein Helfer rät, du berichtigst, er lernt daraus':'der Sortier-Kern rät, du berichtigst'}. In die Akte kommt nur das Ergebnis.</p>
     <div class="schritte"><span class="an">raten</span><span class="an">berichtigen</span><span class="an">lernen</span></div>
     <div class="liste" style="margin-top:10px">${organizer.length ? organizer.map((o,i) => `<div class="zeile"><span class="art ${o.art}">${o.art}</span><span class="mitte"><strong>${esc(o.titel)}</strong><small>→ ${bereich(o.vorschlag).name} / ${esc(o.vorgang)}</small></span>${o.sicher?'<span class="marke2 m-ok">bestätigt</span>':`<select class="feld" data-osort="${i}" aria-label="Bereich" style="max-width:120px;padding:5px">${BEREICHE.map(b => `<option value="${b.id}" ${b.id===o.vorschlag?'selected':''}>${b.name}</option>`).join('')}</select><button class="knopf gruen" style="padding:6px 10px" data-a="osort" data-i="${i}">Stimmt</button>`}</div>`).join('') : '<p class="leer">Alles ist in der Akte.</p>'}</div>
     <div class="reihe"><button class="knopf gruen voll" data-a="sort-zur-akte" ${organizer.length?'':'disabled'}>Zur Akte ${ic('pfeil')}</button></div>`;
  else {
    const ds = ids.length ? ids.map(i => docs.find(d => d.id === i)) : docs.filter(d => d.bei === wid);
    inhalt = ds.length ? `${V3?'':'<div class="schritte"><span class="an">1 Herausgeben</span><span class="an">2 Arbeiten</span><span>3 Zurücklegen</span></div>'}
     ${ds.map(d => `<div class="blatt" style="margin-bottom:8px"><small>Kopie · Fassung ${d.fassung}</small><b>${esc(d.titel)}</b>${esc(d.text)}<p style="margin-top:8px"><span class="mark">Hier wurde etwas markiert (Beispiel)</span></p></div>`).join('')}
     <button class="knopf gruen voll" data-a="zurueck" data-id="${wid}" data-docs="${ds.map(d => d.id).join(',')}">${V3?'Zur Akte':'Ergebnis zurücklegen'} ${ic('pfeil')}</button>
     <p class="hinweis">Nur eine Beispielansicht. Hier wird nichts wirklich bearbeitet.</p>`
     : `<p class="leer">Gerade liegt hier nichts. Öffne in der Akte eine Unterlage und tippe auf „In ${esc(w.name)} ${w.verb}“.</p>${wid==='pdf'&&V3?`<button class="knopf voll" data-a="scan">${ic('kamera')} Neu scannen</button>`:''}`;
  }
  fenster(kopf + `<div id="astinhalt">${inhalt}</div>`, 'ast', w.farbe);
  zeigen();
}
function portemonnaie(){
  const rest = geld.posten.reduce((a,p) => a + p.b, 0), aus = geld.posten.filter(p => p.b < 0).reduce((a,p) => a - p.b, 0);
  return `<p class="unter">Kein Buchhaltungsprogramm. Nur: was kam herein, was ging hinaus, was bleibt.</p>
   <div class="karte" style="margin:10px 0"><small style="color:var(--muted)">Übrig im November</small><div class="geld">${euro(rest)}</div><small style="color:var(--muted)">von ${euro(geld.start)} · ausgegeben ${euro(aus)}</small></div>
   <button class="knopf gruen voll" data-a="bon">${ic('kamera')} Bon fotografieren</button>
   <form class="reihe" data-form="posten"><input class="feld" name="t" placeholder="Wofür?" aria-label="Wofür" style="flex:2 1 120px"><input class="feld" name="b" inputmode="decimal" placeholder="Betrag" aria-label="Betrag" style="flex:1 1 80px"><button class="knopf hell" name="art" value="ein">+ Eingang</button><button class="knopf hell" name="art" value="aus">− Ausgang</button></form>
   <div class="liste" style="margin-top:12px">${[...geld.posten].reverse().map(p => `<div class="zeile"><span class="mitte"><strong>${esc(p.t)}</strong>${p.bon?'<small>Bon liegt in der Akte: Geld &amp; Belege / Ausgaben 2026</small>':''}</span><span class="${p.b<0?'minus':'plus'}">${p.b<0?'−':'+'} ${euro(Math.abs(p.b))}</span></div>`).join('')}</div>
   <p class="hinweis">Die Monatsübersicht liegt immer als Kopie in der Akte (Geld &amp; Belege / Ausgaben 2026).</p>`;
}
function geldInAkte(){
  const rest = geld.posten.reduce((a,p) => a + p.b, 0), text = `Monatsübersicht aus dem Portemonnaie. ${geld.posten.length} Posten. Übrig: ${euro(rest)}.`;
  let d = docs.find(x => x.id === geld.docId);
  if (!d) { d = {id:++nr,titel:'Portemonnaie November 2026',art:'BELEG',bereich:'geld',vorgang:'Ausgaben 2026',datum:'17.11.2026',herkunft:'Portemonnaie',fassung:1,bei:null,text}; docs.push(d); geld.docId = d.id; }
  else d.text = text;
}
function fAblegen(){
  const z = (a, i, t, u) => `<button class="zeile" data-a="${a}"><span class="art">${ic(i)}</span><span class="mitte"><strong>${t}</strong><small>${u}</small></span>${ic('weiter')}</button>`;
  fenster(`${fk('Ablegen','Was möchtest du hineinlegen?')}<div class="liste">
   ${V3 ? z('bon-start','kamera','Foto: Bon fürs Portemonnaie','wird abgezogen, der Bon liegt in der Akte') : ''}
   ${z('foto','kamera','Foto: Unterlage','ein Bild direkt in die Akte')}
   ${z('datei','datei','Datei','vom Gerät oder aus einem Ordner')}
   ${z('viele','sort','Viele Dateien auf einmal',V3?'öffnet das Werkzeug „Sortieren“':'gehen zuerst an den Datei-Organizer')}
  </div>`);
}
function neuInEingang(titel, art, vorschlag, vorgang, quelle){
  eingang.neu.unshift({id:++nr,titel,art,vorschlag,vorgang,quelle,sicher:false,text:'Neu abgelegt (Beispiel).'});
  zu(); s.ansicht = 'eingang'; zeigen(); toast('Liegt im Eingang. Der Vorschlag wartet auf dein „Stimmt“.');
}

/* ---------- Aktionen ---------- */
const A = {
 geh: e => { s.ansicht = e.dataset.zu; s.bereich = null; s.frage = ''; s.wahl.clear(); zu(); zeigen(); scrollTo(0,0); },
 bereich: e => { s.ansicht = 'akten'; s.bereich = e.dataset.id || null; zeigen(); scrollTo(0,0); },
 frage: e => { s.frage = e.dataset.q; s.ansicht = 'start'; s.wahl.clear(); zeigen(); },
 doc: e => fDoc(e.dataset.id),
 zu, 'zu-aussen': (e, ev) => { if (ev.target === e) zu(); },
 hilfe: () => fenster(`${fk('So funktioniert '+NAME)}<ul style="padding-left:18px;margin:0;display:grid;gap:8px">
   <li><b>Hineinlegen:</b> der grüne Knopf „Ablegen“.</li><li><b>Finden:</b> die Suche oben oder die sechs Bereiche.</li>
   <li><b>Herausgeben:</b> Unterlage antippen. ${V3?'Das passende Werkzeug öffnet sich in derselben App.':'Sie geht mit einem Laufzettel an das passende Modul.'}</li>
   <li><b>Zurück:</b> das Ergebnis liegt als neue Fassung am alten Platz. Das Original bleibt.</li>
   <li>${V3?'<b>Der Baum:</b> unter „Werkzeuge“ siehst du, wo gearbeitet wird.':'<b>Module:</b> dort steht, welche Apps da sind und welche fehlen.'}</li></ul>
   <p class="hinweis">Entwurf Version ${F}. Alles ist ein Beispiel, nichts wird gespeichert.</p>`),
 sicherung: () => fenster(`${fk('Sicherung')}<div class="liste"><div class="zeile"><span class="mitte"><strong>Tresor</strong><small>eingerichtet (Beispiel)</small></span><span class="marke2 m-ok">in Ordnung</span></div><div class="zeile"><span class="mitte"><strong>Letzte Sicherung</strong><small>heute, zweiter Ort</small></span><span class="marke2 m-ok">in Ordnung</span></div><div class="zeile"><span class="mitte"><strong>Papierkorb</strong><small>leer</small></span></div></div>`),
 ablegen: fAblegen,
 foto: () => neuInEingang('Foto vom '+new Date().toLocaleDateString('de-DE'),'JPG','ich','Sonstiges','Foto'),
 datei: () => neuInEingang('Schreiben der Versicherung','PDF','kauf','Auto','Datei'),
 viele: () => { zu(); if (V3) fWerkzeug('sort'); else { organizer.filter(o => !o.sicher).forEach(o => eingang.neu.unshift({id:++nr,titel:o.titel,art:o.art,vorschlag:o.vorschlag,vorgang:o.vorgang,quelle:'Datei-Organizer',text:''})); const n = organizer.filter(o => o.sicher); n.forEach(o => docs.push({id:++nr,titel:o.titel,art:o.art,bereich:o.vorschlag,vorgang:o.vorgang,datum:'17.11.2026',herkunft:'Datei-Organizer',fassung:1,bei:null,text:o.titel})); organizer.length = 0; s.ansicht = 'eingang'; zeigen(); toast(`${n.length} bestätigte Dateien sind direkt abgelegt. Nur das Unsichere wartet im Eingang.`); } },
 'sort-zur-akte': () => { const offen = organizer.filter(o => !o.sicher); if (offen.length) return toast(`Noch ${offen.length} unsicher. Bitte erst „Stimmt“ oder berichtigen.`); const n = organizer.length; organizer.forEach(o => docs.push({id:++nr,titel:o.titel,art:o.art,bereich:o.vorschlag,vorgang:o.vorgang,datum:'17.11.2026',herkunft:'Sortieren',fassung:1,bei:null,text:o.titel})); organizer.length = 0; s.reisen = Array(3).fill('sort'); zu(); s.ansicht = 'werkzeuge'; zeigen(); toast(`${n} Dateien sind in der Akte, jede an ihrem Platz.`); },
 bestaetigen: e => { const i = eingang.neu.findIndex(x => x.id == e.dataset.id), x = eingang.neu[i]; eingang.neu.splice(i,1); docs.push({id:x.id,titel:x.titel,art:x.art,bereich:x.vorschlag,vorgang:x.vorgang,datum:'17.11.2026',herkunft:x.quelle,fassung:1,bei:null,text:x.text||x.titel}); zeigen(); toast(`Abgelegt in ${bereich(x.vorschlag).name} / ${x.vorgang}.`); },
 zettel: e => fZettel(e.dataset.id, e.dataset.docs.split(',')),
 mappe: fMappe,
 werkzeug: e => fWerkzeug(e.dataset.id, (e.dataset.docs||'').split(',')),
 zurueck: e => { const w = werkzeug(e.dataset.id), ids = e.dataset.docs.split(',').map(Number);
   ids.forEach(i => { const d = docs.find(x => x.id === i); d.bei = null; d.fassung++; eingang.zurueck.unshift({doc:d.id,titel:d.titel,text:`Fassung ${d.fassung} aus ${w.name} · liegt in ${ort(d)}`}); });
   s.wahl.clear(); s.reisen = ids.map(() => w.id); zu(); s.ansicht = V3 ? 'werkzeuge' : 'eingang'; s.frage = ''; zeigen();
   toast(ids.length === 1 ? `Liegt als Fassung ${docs.find(x => x.id === ids[0]).fassung} am alten Platz. Ohne Rückfrage.` : `${ids.length} Unterlagen liegen als neue Fassung an ihrem Platz.`); },
 osort: e => { organizer[+e.dataset.i].sicher = true; fWerkzeug('sort'); toast('Gemerkt. Der Helfer lernt aus deiner Berichtigung.'); },
 bon: () => { const [t,b] = bons[geld.bonNr++ % bons.length]; geld.posten.push({t,b,bon:true}); docs.push({id:++nr,titel:'Bon '+t,art:'BELEG',bereich:'geld',vorgang:'Ausgaben 2026',datum:'17.11.2026',herkunft:'Portemonnaie',fassung:1,bei:null,text:`Kassenbon ${t}, ${euro(-b)}.`}); geldInAkte(); $('astinhalt').innerHTML = portemonnaie(); zeigen(); toast(`${euro(-b)} abgezogen. Der Bon liegt in der Akte.`); },
 'bon-start': () => { zu(); fWerkzeug('geld'); A.bon(); },
 scan: () => { zu(); neuInEingang('Neuer Scan','PDF','ich','Sonstiges','PDF & Scan'); },
 kopie: () => toast('Eine Kopie liegt in deinen Downloads (Beispiel). Das Original bleibt in der Akte.'),
 teilen: () => toast('Hier öffnet sich das Teilen-Fenster des Geräts (Beispiel).'),
 fehlt: () => toast('Hier ginge es zum Download des Moduls (Beispiel).')
};
document.addEventListener('click', ev => { const e = ev.target.closest('[data-a]'); if (e && A[e.dataset.a]) A[e.dataset.a](e, ev); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') zu(); if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('g[data-a]')) { ev.preventDefault(); A[ev.target.dataset.a](ev.target, ev); } });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.wahl) { const i = +t.dataset.wahl; t.checked ? s.wahl.add(i) : s.wahl.delete(i); zeigen(); }
  if (t.dataset.osort) organizer[+t.dataset.osort].vorschlag = t.value;
  if (t.dataset.vorschlag) eingang.neu.find(x => x.id == t.dataset.vorschlag).vorschlag = t.value;
});
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target, art = ev.submitter?.value;
  if (f.dataset.form === 'suche') { s.frage = f.q.value.trim(); s.wahl.clear(); zeigen(); }
  if (f.dataset.form === 'posten') { const b = parseFloat(f.b.value.replace(',','.')); if (!(b > 0)) return toast('Bitte einen Betrag eintragen.'); geld.posten.push({t:f.t.value.trim() || (art==='ein'?'Eingang':'Ausgang'), b: art==='ein' ? b : -b}); geldInAkte(); $('astinhalt').innerHTML = portemonnaie(); zeigen(); }
});
function zeigen(){
  navZeigen();
  $('main').innerHTML = ({start:vStart, akten:vAkten, eingang:vEingang, werkzeuge:vWerkzeuge})[s.ansicht]();
}
$('marke').textContent = V3 ? 'PA' : 'MA';
$('appname').textContent = NAME;
$('fassung').textContent = `Version ${F} · Entwurf vom 17.11.2026`;
zeigen();
</script>
